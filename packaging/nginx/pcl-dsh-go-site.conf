# PCL-DSH-Go Nginx site template (rendered by packaging/install.sh)
# SPDX-License-Identifier: GPL-3.0-or-later
# Installed as /etc/nginx/sites-available/pcl-dsh-go.conf (included in http{}).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $pcl_dsh_host {
    default $http_host;
    ''      $host;
}

server {
    listen @LISTEN_PORT@ default_server;
    listen [::]:@LISTEN_PORT@ default_server;
    server_name _;
    server_tokens off;

    root @PREFIX@/current/static;
    index index.html;

    # Integration packs are uploaded through /api/packs/preview (2 GiB limit).
    client_max_body_size 2048m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $pcl_dsh_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    location ^~ /workbench/ {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $pcl_dsh_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|ico|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
