# PCL-DSH-Go manager | Nginx production reverse-proxy template (M2)
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Install (M5 install.sh / operator):
#   cp packaging/nginx/pcl-dsh-go.conf /etc/nginx/conf.d/pcl-dsh-go.conf
#   nginx -t && nginx -s reload          # or: systemctl reload nginx
#
# This file is included inside the http{} context (conf.d/ or sites-enabled/), which is
# required by the map below. The manager itself must listen on 127.0.0.1:8080 only;
# Nginx is the only public entry (TLS termination is an operator concern, see README).
#
# M2 decisions (docs/M2_INTERFACES.md §5):
#   - listen 80, static root /opt/pcl-dsh-go/current/release/static (M4/M5 populates it)
#   - /api/      HTTP/1.1 proxy, X-Real-IP / X-Forwarded-For, SSE unbuffered, huge bodies
#   - /workbench/ same + WebSocket Upgrade, 3600s read/send timeouts
#   - access_log off on sensitive locations (queries may carry one-time tokens)
#   - server_tokens off, optional source-IP allowlist example (commented)

# WebSocket Upgrade helper (must stay in the http{} context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the client Host INCLUDING a non-default port. manager's proxy Origin fence
# compares Origin host:port with the request Host; $host drops the port, which would
# 403 same-origin writes/WS on non-80 listeners. Fall back to $host if Host is empty.
map $http_host $pcl_dsh_host {
    default $http_host;
    ''      $host;
}

server {
    listen 80;
    # listen [::]:80;   # enable when the host has a working IPv6 listener

    server_name _;
    server_tokens off;

    root /opt/pcl-dsh-go/current/release/static;
    index index.html;

    # Large uploads (avatar/artifact/pack) are streamed; keep it generous.
    client_max_body_size 2048m;

    # Optional source-IP allowlist (enable per deployment):
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # ---- v1 JSON API (includes Job SSE: /api/jobs/{id}/events) -------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $pcl_dsh_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE must stream through; long-lived Job streams need generous timeouts.
        # Streaming request/response bodies: avoid Nginx buffering large uploads.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Query strings may carry sensitive values; do not write them to access logs.
        access_log off;
    }

    # ---- /workbench reverse proxy (HTTP + static + SSE + WebSocket) --------------
    location ^~ /workbench/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $pcl_dsh_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (DSH /api/remote.mux) and keep-alive semantics.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream both directions (large uploads/SSE/WS); never buffer to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        access_log off;
    }

    # ---- SPA static assets ------------------------------------------------------
    # index.html must never be cached so a new build is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed web assets (webpack/vite output) are safe to cache long-term.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|ico|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Single-page application fallback (static root may be empty before M4/M5).
    location / {
        try_files $uri $uri/ /index.html;
    }
}